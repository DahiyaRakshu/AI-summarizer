<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocuFlow — API Test</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #FAF7F2; color: #2D2A26; padding: 40px; max-width: 700px; margin: 0 auto; }
        h1 { font-family: 'DM Serif Display', serif; font-size: 28px; margin-bottom: 8px; }
        p { color: #6B6560; margin-bottom: 24px; }
        .card { background: #fff; border: 1px solid #E8E1D8; border-radius: 12px; padding: 24px; margin-bottom: 16px; }
        .card h3 { margin-bottom: 12px; }
        .status { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status.ok { background: #DCFCE7; color: #16A34A; }
        .status.fail { background: #FEE2E2; color: #DC2626; }
        .status.pending { background: #FEF3C7; color: #D97706; }
        pre { background: #1A1714; color: #F5F0E8; padding: 16px; border-radius: 8px; font-size: 13px; overflow-x: auto; margin-top: 12px; }
        button { background: #C87941; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin: 8px 8px 8px 0; }
        button:hover { background: #B06830; }
        input { width: 100%; padding: 10px 14px; border: 1px solid #E8E1D8; border-radius: 8px; font-size: 14px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <h1>DocuFlow API Test</h1>
    <p>Use this page to test your Google Sheets connection.</p>

    <div class="card">
        <h3>1. Test Connection</h3>
        <button onclick="testConnection()">Test GET Request</button>
        <span class="status pending" id="getTest">Pending</span>
        <pre id="getResult">No result yet</pre>
    </div>

    <div class="card">
        <h3>2. Test Signup</h3>
        <input type="text" id="testName" placeholder="Name" value="Test User" />
        <input type="email" id="testEmail" placeholder="Email" value="test@example.com" />
        <input type="tel" id="testPhone" placeholder="Phone" value="+919876543210" />
        <input type="password" id="testPass" placeholder="Password" value="test123" />
        <button onclick="testSignup()">Test Signup</button>
        <span class="status pending" id="signupTest">Pending</span>
        <pre id="signupResult">No result yet</pre>
    </div>

    <div class="card">
        <h3>3. Test Login</h3>
        <input type="email" id="loginEmail" placeholder="Email" value="test@example.com" />
        <input type="password" id="loginPass" placeholder="Password" value="test123" />
        <button onclick="testLogin()">Test Login</button>
        <span class="status pending" id="loginTest">Pending</span>
        <pre id="loginResult">No result yet</pre>
    </div>

    <div class="card">
        <h3>Current API URL</h3>
        <pre id="currentApi">Loading...</pre>
    </div>

    <script>
        // Get current API URL from login.js
        fetch('login.js').then(r => r.text()).then(js => {
            const match = js.match(/GOOGLE_SHEET_API\s*=\s*'([^']+)'/);
            if (match) document.getElementById('currentApi').textContent = match[1];
        });

        const API_URL = 'https://script.google.com/macros/s/AKfycbwWddWL9tqKxSAvj8CKB5ZraT6JSf6Q_Cz8hyY9AfDmP3Cm1rvOmA4cxUXfcngHw2mg/exec';

        function setStatus(id, ok, msg) {
            const el = document.getElementById(id);
            el.textContent = ok ? 'PASS' : 'FAIL';
            el.className = 'status ' + (ok ? 'ok' : 'fail');
        }

        async function testConnection() {
            document.getElementById('getResult').textContent = 'Testing...';
            try {
                const r = await fetch(API_URL);
                const data = await r.json();
                document.getElementById('getResult').textContent = JSON.stringify(data, null, 2);
                setStatus('getTest', data.status === 'ok');
            } catch (err) {
                document.getElementById('getResult').textContent = 'Error: ' + err.message;
                setStatus('getTest', false);
            }
        }

        async function testSignup() {
            document.getElementById('signupResult').textContent = 'Testing...';
            const payload = {
                action: 'signup',
                name: document.getElementById('testName').value,
                email: document.getElementById('testEmail').value,
                phone: document.getElementById('testPhone').value,
                password: document.getElementById('testPass').value
            };
            try {
                const r = await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                document.getElementById('signupResult').textContent = 'Request sent (no-cors mode). Check your Google Sheet for new row.';
                setStatus('signupTest', true);
            } catch (err) {
                document.getElementById('signupResult').textContent = 'Error: ' + err.message;
                setStatus('signupTest', false);
            }
        }

        async function testLogin() {
            document.getElementById('loginResult').textContent = 'Testing...';
            const payload = {
                action: 'login',
                email: document.getElementById('loginEmail').value,
                password: document.getElementById('loginPass').value
            };
            try {
                const r = await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                document.getElementById('loginResult').textContent = 'Request sent (no-cors mode). Check Apps Script logs for response.';
                setStatus('loginTest', true);
            } catch (err) {
                document.getElementById('loginResult').textContent = 'Error: ' + err.message;
                setStatus('loginTest', false);
            }
        }
    </script>
</body>
</html>
