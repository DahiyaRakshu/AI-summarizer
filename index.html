<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocuFlow — Loading</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #FAF7F2;
            color: #2D2A26;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 24px;
        }
        .loader {
            width: 60px;
            height: 60px;
            border: 3px solid #E8E1D8;
            border-top-color: #C87941;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .brand-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: #C87941;
            display: grid;
            place-items: center;
            color: #FAF7F2;
        }
        .brand-icon svg { width: 20px; height: 20px; }
        .brand-name {
            font-family: 'DM Serif Display', serif;
            font-size: 28px;
        }
        .status {
            font-size: 13px;
            color: #9E968E;
            letter-spacing: 0.5px;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #1A1714; color: #F5F0E8; }
            .loader { border-color: #332F2A; border-top-color: #C9A96E; }
            .status { color: #7A7268; }
        }
    </style>
</head>
<body>
    <div class="brand">
        <div class="brand-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                <polyline points="14 2 14 8 20 8" />
                <line x1="16" y1="13" x2="8" y2="13" />
                <line x1="16" y1="17" x2="8" y2="17" />
            </svg>
        </div>
        <span class="brand-name">DocuFlow</span>
    </div>
    <div class="loader"></div>
    <p class="status" id="status">Checking authentication...</p>

    <script>
        (function() {
            var status = document.getElementById('status');
            var user = null;

            try {
                user = JSON.parse(localStorage.getItem('docuflow-user'));
            } catch (e) {}

            if (user && user.email) {
                status.textContent = 'Welcome back! Redirecting to dashboard...';
                setTimeout(function() {
                    window.location.href = 'dashboard.html';
                }, 600);
            } else {
                status.textContent = 'Redirecting to login...';
                setTimeout(function() {
                    window.location.href = 'login.html';
                }, 600);
            }
        })();
    </script>
</body>
</html>
